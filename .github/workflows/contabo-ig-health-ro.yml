name: Contabo IG health RO2

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type readonly-ig-health
        required: true
        type: string

jobs:
  inspect:
    if: github.event.inputs.confirm == 'readonly-ig-health'
    runs-on: [self-hosted, linux, x64, valueor-production]
    timeout-minutes: 10
    steps:
      - name: Deep RO Instagram health
        run: |
          set -euo pipefail
          echo "=== unit / cwd / start script ==="
          systemctl show valueor-api.service -p WorkingDirectory -p ExecStart -p MainPID -p FragmentPath
          echo "--- /etc/valueor/api-safe-start.sh ---"
          sudo -n sed -n '1,120p' /etc/valueor/api-safe-start.sh 2>/dev/null || sed -n '1,120p' /etc/valueor/api-safe-start.sh 2>/dev/null || true
          echo "--- /opt/valueor-current ---"
          ls -la /opt/valueor-current 2>/dev/null | head -n 40 || true
          readlink -f /opt/valueor-current 2>/dev/null || true
          echo "--- find bundle ---"
          sudo -n find /opt/valueor-current /opt/valueor -type f \( -name 'main.mjs' -o -name 'index.js' -o -name 'server.mjs' \) 2>/dev/null | head -n 40 || true
          MAIN="$(sudo -n find /opt/valueor-current /opt/valueor -name 'main.mjs' 2>/dev/null | head -n 1 || true)"
          echo "MAIN=$MAIN"
          if [[ -n "${MAIN:-}" ]]; then
            python3 - "$MAIN" <<'PY'
          import re,sys
          data=open(sys.argv[1],'rb').read().decode('utf-8','ignore')
          for pat in ['INSTAGRAM_OUTBOUND_HEALTH_TIMEOUT_MS','instagram_health_timeout','instagramHealthDiag','channel-outbound-health','graph.instagram.com','withTimeout']:
            print(pat, data.count(pat))
          m=re.search(r'INSTAGRAM_OUTBOUND_HEALTH_TIMEOUT_MS[=:][^,\n;]{0,20}', data)
          print('timeout_assign', m.group(0) if m else None)
          PY
          fi

          echo "=== pino / log files ==="
          sudo -n ls -la /var/log/valueor /opt/valueor/logs /opt/valueor-current/logs 2>/dev/null || true
          sudo -n find /var/log /opt/valueor /opt/valueor-current -name '*valueor*' -o -name '*api*.log' 2>/dev/null | head -n 40 || true

          echo "=== sudo journal last 30 lines ==="
          sudo -n journalctl -u valueor-api.service -n 30 --no-pager 2>&1 | head -n 40 || true

          echo "=== sudo journal grep instagram last 48h ==="
          sudo -n journalctl -u valueor-api.service --since '48 hours ago' --no-pager 2>&1 \
            | grep -i instagram | grep -viE 'access_token|app_secret|Bearer |password' | tail -n 50 || echo none

          echo "=== nginx access logs list + greps ==="
          sudo -n ls -la /var/log/nginx 2>/dev/null | head -n 40 || true
          sudo -n sh -c 'grep -RIl "channel-outbound-health" /var/log/nginx 2>/dev/null | head -n 10' || true
          sudo -n sh -c 'zgrep -h "channel-outbound-health" /var/log/nginx/* 2>/dev/null | tail -n 40' || true

          echo "=== INTERNAL_API_KEY presence only ==="
          if sudo -n test -f /opt/valueor/.env; then
            sudo -n python3 - <<'PY'
          import pathlib
          text=pathlib.Path('/opt/valueor/.env').read_text(encoding='utf-8', errors='ignore')
          for line in text.splitlines():
            if line.startswith('INTERNAL_API_KEY='):
              val=line.split('=',1)[1].strip().strip('"').strip("'")
              print('INTERNAL_API_KEY_present', bool(val), 'len', len(val))
              break
          else:
            print('INTERNAL_API_KEY_present', False)
          PY
          fi

          echo "=== authenticated health via INTERNAL_API_KEY (localhost) ==="
          sudo -n python3 - <<'PY'
          import json, time, urllib.request, urllib.error, pathlib
          key=None
          for line in pathlib.Path('/opt/valueor/.env').read_text(encoding='utf-8', errors='ignore').splitlines():
            if line.startswith('INTERNAL_API_KEY='):
              key=line.split('=',1)[1].strip().strip('"').strip("'")
              break
          if not key:
            print(json.dumps({'error':'no_internal_key'})); raise SystemExit(0)
          url='http://127.0.0.1:3001/api/instagram/channel-outbound-health'
          body=json.dumps({
            'companyId':'2d27f7fb-c15e-4d60-84e9-1793f36f2172',
            'companyChannelId':'4be76292-b32b-4a7c-a760-e2559bdc9af4',
          }).encode()
          req=urllib.request.Request(url, data=body, method='POST')
          req.add_header('Origin','https://www.valueor.org')
          req.add_header('Content-Type','application/json')
          req.add_header('Authorization', f'Bearer {key}')
          # some deployments use x-internal-api-key
          req.add_header('X-Internal-Api-Key', key)
          t=time.time()
          try:
            with urllib.request.urlopen(req, timeout=45) as res:
              raw=res.read(1200)
              headers={k.lower():v for k,v in res.headers.items() if k.lower().startswith('access-control') or k.lower() in ('content-type','x-request-id')}
              print(json.dumps({'status':res.status,'ms':int((time.time()-t)*1000),'headers':headers,'body':raw.decode('utf-8','ignore')[:1000]}))
          except urllib.error.HTTPError as e:
            raw=e.read(1200)
            headers={k.lower():v for k,v in e.headers.items() if k.lower().startswith('access-control') or k.lower() in ('content-type','x-request-id')}
            print(json.dumps({'status':e.code,'ms':int((time.time()-t)*1000),'headers':headers,'body':raw.decode('utf-8','ignore')[:1000]}))
          except Exception as e:
            print(json.dumps({'error':str(e),'ms':int((time.time()-t)*1000)}))
          PY

          echo "=== sequential graph timing from Contabo ==="
          python3 - <<'PY'
          import json, time, urllib.request, urllib.error
          def one():
            req=urllib.request.Request('https://graph.instagram.com/v21.0/me?fields=id', headers={'Authorization':'Bearer INVALID'})
            t=time.time()
            try:
              with urllib.request.urlopen(req, timeout=30) as res:
                return {'status':res.status,'ms':int((time.time()-t)*1000)}
            except urllib.error.HTTPError as e:
              e.read()
              return {'status':e.code,'ms':int((time.time()-t)*1000)}
            except Exception as e:
              return {'error':str(e),'ms':int((time.time()-t)*1000)}
          print(json.dumps({'calls':[one(), one(), one()]}))
          PY

          echo "=== done ==="
