name: Contabo IG health RO4

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type readonly-ig-health
        required: true
        type: string

jobs:
  inspect:
    if: github.event.inputs.confirm == 'readonly-ig-health'
    runs-on: [self-hosted, linux, x64, valueor-production]
    timeout-minutes: 10
    steps:
      - name: Node fetch Graph from Contabo
        run: |
          set -euo pipefail
          echo "=== node fetch graph.instagram.com 3x ==="
          node <<'NODE'
          async function one(i) {
            const t = Date.now();
            try {
              const res = await fetch('https://graph.instagram.com/v21.0/me?fields=id', {
                headers: { Authorization: 'Bearer INVALID' },
              });
              const text = await res.text();
              console.log(JSON.stringify({ i, status: res.status, ms: Date.now() - t, bodyLen: text.length }));
            } catch (e) {
              console.log(JSON.stringify({ i, error: String(e), ms: Date.now() - t }));
            }
          }
          await one(1); await one(2); await one(3);
          NODE

          echo "=== node fetch graph.facebook.com ==="
          node <<'NODE'
          const t = Date.now();
          try {
            const res = await fetch('https://graph.facebook.com/v21.0/me?fields=id', {
              headers: { Authorization: 'Bearer INVALID' },
            });
            console.log(JSON.stringify({ status: res.status, ms: Date.now() - t, body: (await res.text()).slice(0,120) }));
          } catch (e) {
            console.log(JSON.stringify({ error: String(e), ms: Date.now() - t }));
          }
          NODE

          echo "=== dns ==="
          getent hosts graph.instagram.com || true
          getent hosts graph.facebook.com || true

          echo "=== done ==="
