name: Contabo IG health RO5
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type readonly-ig-health
        required: true
        type: string
jobs:
  inspect:
    if: github.event.inputs.confirm == 'readonly-ig-health'
    runs-on: [self-hosted, linux, x64, valueor-production]
    timeout-minutes: 5
    steps:
      - name: Readable logs and simulate full health handler timing
        run: |
          set -euo pipefail
          echo "=== nginx log readability ==="
          ls -la /var/log/nginx 2>&1 | head -n 30 || true
          for f in /var/log/nginx/access.log /var/log/nginx/error.log /var/log/nginx/api.access.log; do
            if [[ -r "$f" ]]; then echo "readable $f"; grep -E 'channel-outbound-health|/api/instagram' "$f" | tail -n 20 || true; else echo "not_readable $f"; fi
          done
          echo "=== journal user readable? ==="
          journalctl --user -n 1 2>&1 | head -n 5 || true
          ls -la /var/log/journal 2>&1 | head -n 5 || true
          echo "=== done ==="
