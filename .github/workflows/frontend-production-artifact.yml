name: Frontend production artifact

# Build-only CI. Does NOT publish to Contabo.
# Production frontend publishing happens only via the unified VPS deploy workflow
# on the dedicated self-hosted production runner.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "artifacts/login-app/**"
      - "scripts/verify-frontend-production-bundle.mjs"
      - ".github/workflows/frontend-production-artifact.yml"

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build login-app for production hosts
        run: pnpm --dir artifacts/login-app build
        env:
          VITE_APP_ORIGIN: https://www.valueor.org
          VITE_SITE_URL: https://www.valueor.org
          VITE_API_SERVER_URL: https://api.valueor.org
          VITE_WEBHOOK_BASE_URL: https://webhook.valueor.org
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Keep build-only artifact aligned with vps-deploy.yml bake-time gates.
          VITE_WHATSAPP_EMBEDDED_SIGNUP_ENABLED: "true"
          VITE_WHATSAPP_COEXISTENCE_ENABLED: "false"
          VITE_META_MESSENGER_OAUTH_ENABLED: "true"
          VITE_META_INSTAGRAM_LOGIN_ENABLED: "false"
          VITE_META_PAGES_OAUTH_ENABLED: "false"

      - name: Write version.json
        run: |
          printf '{"service":"login-app","sha":"%s"}\n' "${GITHUB_SHA}" \
            > artifacts/login-app/dist/public/version.json

      - name: Verify production hosts in bundle
        run: node scripts/verify-frontend-production-bundle.mjs artifacts/login-app/dist/public

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: valueor-frontend-build
          path: artifacts/login-app/dist/public
          if-no-files-found: error
          retention-days: 14
