name: Frontend production artifact

on:
  workflow_dispatch:
    inputs:
      publish_www:
        description: Set to publish-www to copy the built SPA into /var/www/valueor on the production VPS
        required: false
        default: ""
        type: string
  push:
    branches: [main, master]
    paths:
      - "artifacts/login-app/**"
      - "scripts/verify-frontend-production-bundle.mjs"
      - ".github/workflows/frontend-production-artifact.yml"

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build login-app for production hosts
        run: pnpm --dir artifacts/login-app build
        env:
          VITE_APP_ORIGIN: https://www.valueor.org
          VITE_SITE_URL: https://www.valueor.org
          VITE_API_SERVER_URL: https://api.valueor.org
          VITE_WEBHOOK_BASE_URL: https://webhook.valueor.org
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Write version.json
        run: |
          printf '{"service":"login-app","sha":"%s"}\n' "${GITHUB_SHA}" \
            > artifacts/login-app/dist/public/version.json

      - name: Verify production hosts in bundle
        run: node scripts/verify-frontend-production-bundle.mjs artifacts/login-app/dist/public

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: valueor-frontend-build
          path: artifacts/login-app/dist/public
          if-no-files-found: error
          retention-days: 14

  publish-www:
    needs: build-frontend
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.event.inputs.publish_www == 'publish-www'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: valueor-frontend-build
          path: frontend-dist

      - name: Publish /var/www/valueor over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          test -f frontend-dist/index.html
          test -f frontend-dist/version.json
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/valueor_vps
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/valueor_vps ~/.ssh/known_hosts
          PORT="${VPS_SSH_PORT:-22}"
          tar -C frontend-dist -czf /tmp/valueor-frontend.tgz .
          scp -P "$PORT" -i ~/.ssh/valueor_vps -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            /tmp/valueor-frontend.tgz "$VPS_USER@$VPS_HOST:/tmp/valueor-frontend-${GIT_SHA}.tgz"
          ssh -p "$PORT" -i ~/.ssh/valueor_vps -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" "SHA='$GIT_SHA' bash -s" <<'EOF'
          set -euo pipefail
          TAR="/tmp/valueor-frontend-${SHA}.tgz"
          STAGE="/tmp/valueor-frontend-${SHA}"
          test -f "$TAR"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          tar -xzf "$TAR" -C "$STAGE"
          test -f "$STAGE/index.html"
          test -f "$STAGE/version.json"
          if [[ -f /opt/valueor/deploy/vps/deploy-production.sh ]]; then
            sudo bash /opt/valueor/deploy/vps/deploy-production.sh publish-frontend --frontend-src "$STAGE"
          else
            mkdir -p /var/www
            if [[ -d /var/www/valueor ]]; then
              rm -rf /var/www/valueor.previous
              mv /var/www/valueor /var/www/valueor.previous
            fi
            mkdir -p /var/www/valueor
            cp -a "${STAGE}/." /var/www/valueor/
          fi
          if [[ -f /opt/valueor/scripts/verify-frontend-production-bundle.mjs ]]; then
            /usr/bin/node /opt/valueor/scripts/verify-frontend-production-bundle.mjs /var/www/valueor
          fi
          cat /var/www/valueor/version.json
          rm -rf "$STAGE" "$TAR"
          EOF
