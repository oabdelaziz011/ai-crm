name: Ops apply sales migrations

# Applies additive sales-order migrations 470–480 on Contabo-resolved DATABASE_URL.
# Never prints connection strings or secrets.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type apply-sales-migrations
        required: true
        type: string
      mode:
        description: inspect lists applied versions only; apply runs missing 470–480
        type: choice
        options:
          - inspect
          - apply
        default: inspect
      seed_delivery_worker:
        description: After apply, upsert Omar delivery worker for ValueOR company if found
        type: boolean
        default: false
      worker_name:
        description: Delivery worker display name
        required: false
        type: string
        default: Omar Abdelaziz
      worker_phone_e164:
        description: Delivery worker phone in E.164
        required: false
        type: string
        default: "+201011404109"

permissions:
  contents: read

jobs:
  migrate:
    if: github.event.inputs.confirm == 'apply-sales-migrations'
    runs-on: [self-hosted, linux, x64, valueor-production]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Inspect or apply sales migrations 470-480
        env:
          MODE: ${{ github.event.inputs.mode }}
          SEED_WORKER: ${{ github.event.inputs.seed_delivery_worker }}
          WORKER_NAME: ${{ github.event.inputs.worker_name }}
          WORKER_PHONE: ${{ github.event.inputs.worker_phone_e164 }}
        run: |
          set -euo pipefail
          echo "host=$(hostname)"
          echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "git_sha=${GITHUB_SHA}"
          echo "mode=${MODE}"
          echo "seed_worker=${SEED_WORKER}"
          echo "worker_name_len=${#WORKER_NAME}"
          echo "worker_phone_len=${#WORKER_PHONE}"

          resolve_database_url() {
            local candidates=(
              /opt/valueor/.env
              /opt/valueor/deploy/vps/production.env
              /home/github-runner/.valueor-db-url
              /home/runner/.valueor-db-url
            )
            local f
            for f in "${candidates[@]}"; do
              if [[ -r "$f" ]]; then
                echo "env_source=$f" >&2
                awk -F= '
                  /^[[:space:]]*#/ {next}
                  $1=="DATABASE_URL" {
                    v=substr($0, index($0,"=")+1)
                    gsub(/^[[:space:]]+|[[:space:]]+$/, "", v)
                    gsub(/^"/, "", v); gsub(/"$/, "", v)
                    gsub(/^'\''/, "", v); gsub(/'\''$/, "", v)
                    print v
                    exit
                  }' "$f"
                return 0
              fi
            done
            if command -v systemctl >/dev/null 2>&1; then
              local pid
              pid="$(systemctl show -p MainPID --value valueor-api 2>/dev/null || true)"
              if [[ -n "${pid:-}" && "${pid}" != "0" && -r "/proc/${pid}/environ" ]]; then
                echo "env_source=proc:${pid}" >&2
                tr '\0' '\n' <"/proc/${pid}/environ" | awk -F= '
                  $1=="DATABASE_URL" { print substr($0, index($0,"=")+1); exit }'
                return 0
              fi
            fi
            return 1
          }

          DATABASE_URL="$(resolve_database_url || true)"
          if [[ -z "${DATABASE_URL}" ]]; then
            echo "trying_sudo_env_resolve=1"
            if sudo -n true 2>/dev/null; then
              for f in /opt/valueor/.env /opt/valueor/deploy/vps/production.env; do
                if sudo -n test -r "$f"; then
                  echo "env_source=sudo:$f"
                  DATABASE_URL="$(sudo -n awk -F= '
                    /^[[:space:]]*#/ {next}
                    $1=="DATABASE_URL" {
                      v=substr($0, index($0,"=")+1)
                      gsub(/^[[:space:]]+|[[:space:]]+$/, "", v)
                      gsub(/^"/, "", v); gsub(/"$/, "", v)
                      gsub(/^'\''/, "", v); gsub(/'\''$/, "", v)
                      print v
                      exit
                    }' "$f")"
                  [[ -n "$DATABASE_URL" ]] && break
                fi
              done
            else
              echo "sudo_n_unavailable=1"
            fi
          fi
          if [[ -z "${DATABASE_URL}" ]]; then
            echo "database_url=missing"
            ls -la /opt/valueor /opt/valueor/.env 2>&1 | head -n 40 || true
            id; groups || true
            exit 4
          fi
          echo "database_url=present len=${#DATABASE_URL}"
          export DATABASE_URL

          python3 - <<'PY'
          import os, sys, pathlib, json
          try:
            import psycopg2
            import psycopg2.extras
          except Exception as e:
            print("psycopg2_import_failed", type(e).__name__, str(e)[:80])
            sys.exit(5)

          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          mig_dir = root / "supabase" / "migrations"
          versions = [
            ("470", "470_company_order_delivery_settings.sql"),
            ("471", "471_sales_orders.sql"),
            ("472", "472_sales_orders_journey_enrichment.sql"),
            ("473", "473_sales_orders_role_permissions_backfill.sql"),
            ("474", "474_update_my_profile_allow_german.sql"),
            ("475", "475_delivery_workers_and_order_enrichment.sql"),
            ("476", "476_delivery_zone_aliases_and_assignment_mode.sql"),
            ("477", "477_delivery_assignment_audit_and_notify.sql"),
            ("478", "478_orders_assign_delivery_role_backfill.sql"),
            ("479", "479_sales_order_customer_cancellation.sql"),
            ("480", "480_cancellation_notification_idempotency.sql"),
          ]
          mode = (os.environ.get("MODE") or "inspect").strip().lower()
          seed = (os.environ.get("SEED_WORKER") or "false").strip().lower() in ("1", "true", "yes")
          worker_name = (os.environ.get("WORKER_NAME") or "Omar Abdelaziz").strip()
          worker_phone = (os.environ.get("WORKER_PHONE") or "+201011404109").strip()

          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          conn.autocommit = False
          cur = conn.cursor(cursor_factory=psycopg2.extras.RealDictCursor)

          cur.execute(
            """
            select version
            from supabase_migrations.schema_migrations
            where version in %s
            order by version
            """,
            (tuple(v for v, _ in versions),),
          )
          applied = {r["version"] for r in cur.fetchall()}
          cur.execute("select max(version) as max_version from supabase_migrations.schema_migrations")
          max_v = cur.fetchone()["max_version"]
          print(json.dumps({"phase": "inventory", "max_version": max_v, "sales_versions_applied": sorted(applied)}))

          results = []
          if mode == "apply":
            for version, filename in versions:
              path = mig_dir / filename
              if not path.is_file():
                print(json.dumps({"version": version, "error": "missing_file", "file": filename}))
                conn.rollback()
                sys.exit(6)
              if version in applied:
                results.append({"version": version, "status": "already_applied"})
                continue
              sql = path.read_text(encoding="utf-8")
              try:
                cur.execute(sql)
                cur.execute(
                  "insert into supabase_migrations.schema_migrations (version) values (%s)",
                  (version,),
                )
                conn.commit()
                applied.add(version)
                results.append({"version": version, "status": "applied"})
              except Exception as e:
                conn.rollback()
                print(json.dumps({"version": version, "status": "failed", "error": type(e).__name__, "detail": str(e)[:300]}))
                sys.exit(7)
            print(json.dumps({"phase": "apply", "results": results}))
          else:
            print(json.dumps({"phase": "inspect_only", "pending": [v for v, _ in versions if v not in applied]}))

          # Verify tables
          cur.execute(
            """
            select to_regclass('public.sales_orders') as sales_orders,
                   to_regclass('public.company_delivery_workers') as workers,
                   to_regclass('public.company_order_settings') as settings,
                   to_regclass('public.sales_order_cancellation_requests') as cancel_requests
            """
          )
          regs = dict(cur.fetchone())
          print(json.dumps({"phase": "verify_regclass", **{k: (str(v) if v else None) for k, v in regs.items()}}))

          if seed and regs.get("workers") and regs.get("settings"):
            # Prefer company linked to Omar profile email when present; else first non-null company.
            cur.execute(
              """
              select p.company_id::text as company_id
              from public.profiles p
              where lower(coalesce(p.email, '')) = lower(%s)
                and p.company_id is not null
              limit 1
              """,
              ("oabdelaziz011@gmail.com",),
            )
            row = cur.fetchone()
            if not row:
              cur.execute(
                """
                select id::text as company_id
                from public.companies
                order by created_at nulls last, id
                limit 1
                """
              )
              row = cur.fetchone()
            if not row:
              print(json.dumps({"phase": "seed_worker", "ok": False, "error": "no_company"}))
            else:
              company_id = row["company_id"]
              cur.execute(
                """
                insert into public.company_order_settings (company_id, ai_order_collection_enabled, require_human_approval)
                values (%s::uuid, true, true)
                on conflict (company_id) do update
                  set ai_order_collection_enabled = true,
                      updated_at = now()
                """,
                (company_id,),
              )
              cur.execute(
                """
                select id::text as id from public.company_delivery_zones
                where company_id = %s::uuid and enabled is distinct from false
                order by created_at nulls last
                limit 1
                """,
                (company_id,),
              )
              zone = cur.fetchone()
              if not zone:
                cur.execute(
                  """
                  insert into public.company_delivery_zones (
                    company_id, governorate, zone_name, enabled, delivery_fee, eta_min, eta_max, eta_unit
                  ) values (%s::uuid, 'Cairo', 'Nasr City', true, 50, 1, 2, 'days')
                  returning id::text as id
                  """,
                  (company_id,),
                )
                zone = cur.fetchone()
              cur.execute(
                """
                select id::text as id from public.company_delivery_workers
                where company_id = %s::uuid
                  and (phone_e164 = %s or lower(full_name) = lower(%s))
                limit 1
                """,
                (company_id, worker_phone, worker_name),
              )
              existing = cur.fetchone()
              if existing:
                cur.execute(
                  """
                  update public.company_delivery_workers
                  set full_name = %s, phone_e164 = %s, is_active = true, updated_at = now()
                  where id = %s::uuid
                  returning id::text as id
                  """,
                  (worker_name, worker_phone, existing["id"]),
                )
                worker = cur.fetchone()
                action = "updated"
              else:
                cur.execute(
                  """
                  insert into public.company_delivery_workers (company_id, full_name, phone_e164, is_active)
                  values (%s::uuid, %s, %s, true)
                  returning id::text as id
                  """,
                  (company_id, worker_name, worker_phone),
                )
                worker = cur.fetchone()
                action = "created"
              if zone and worker:
                cur.execute(
                  "delete from public.company_delivery_worker_zones where worker_id = %s::uuid",
                  (worker["id"],),
                )
                cur.execute(
                  """
                  insert into public.company_delivery_worker_zones (company_id, worker_id, zone_id)
                  values (%s::uuid, %s::uuid, %s::uuid)
                  on conflict do nothing
                  """,
                  (company_id, worker["id"], zone["id"]),
                )
              conn.commit()
              print(json.dumps({
                "phase": "seed_worker",
                "ok": True,
                "action": action,
                "company_id": company_id,
                "worker_id": worker["id"] if worker else None,
                "zone_id": zone["id"] if zone else None,
                "phone_e164": worker_phone,
              }))
          elif seed:
            print(json.dumps({"phase": "seed_worker", "ok": False, "error": "tables_missing"}))

          cur.close()
          conn.close()
          print("DONE")
          PY
