name: Ops WA phone unbind (cloud)

# Uses production environment Supabase secrets (service role). Never prints secrets/tokens.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type unbind-phone
        required: true
        type: string
      phone_number_id:
        description: Meta phone_number_id (empty = list all bound)
        required: false
        type: string
        default: ""
      keep_company_id:
        description: Company UUID to keep
        required: true
        type: string
      apply:
        description: dry-run or apply
        type: choice
        options: [dry-run, apply]
        default: dry-run

jobs:
  unbind:
    if: github.event.inputs.confirm == 'unbind-phone'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Query/clear conflicting phone_number_id via Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          PHONE_NUMBER_ID: ${{ github.event.inputs.phone_number_id }}
          KEEP_COMPANY_ID: ${{ github.event.inputs.keep_company_id }}
          APPLY_MODE: ${{ github.event.inputs.apply }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, sys, urllib.error, urllib.parse, urllib.request

          base = (os.environ.get("SUPABASE_URL") or os.environ.get("VITE_SUPABASE_URL") or "").rstrip("/")
          key = os.environ.get("SUPABASE_SERVICE_ROLE_KEY") or ""
          phone = (os.environ.get("PHONE_NUMBER_ID") or "").strip()
          keep = (os.environ.get("KEEP_COMPANY_ID") or "").strip().lower()
          apply = (os.environ.get("APPLY_MODE") or "").strip().lower() == "apply"

          print(f"supabase_url_present={'yes' if base else 'no'}")
          print(f"service_role_present={'yes' if key else 'no'}")
          print(f"supabase_url_len={len(base)} service_role_len={len(key)}")
          if not base or not key:
            print("Missing SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY in production environment")
            sys.exit(3)
          if len(keep) != 36:
            print("Invalid keep_company_id")
            sys.exit(2)

          def req(method: str, path: str, body: dict | None = None):
            data = None if body is None else json.dumps(body).encode()
            request = urllib.request.Request(
              f"{base}{path}",
              data=data,
              method=method,
              headers={
                "Authorization": f"Bearer {key}",
                "apikey": key,
                "Content-Type": "application/json",
                "Prefer": "return=representation",
              },
            )
            try:
              with urllib.request.urlopen(request) as resp:
                raw = resp.read().decode()
                return resp.status, json.loads(raw) if raw else None
            except urllib.error.HTTPError as e:
              raw = e.read().decode()
              try:
                parsed = json.loads(raw) if raw else {"message": str(e)}
              except Exception:
                parsed = {"message": raw or str(e)}
              print(f"http_error status={e.code} body={parsed}")
              sys.exit(4)

          status, rows = req(
            "GET",
            "/rest/v1/company_whatsapp_settings?select=company_id,phone_number_id,business_account_id,enabled&order=company_id",
          )
          if not isinstance(rows, list):
            print("unexpected_response", rows)
            sys.exit(4)
          bound = [r for r in rows if str(r.get("phone_number_id") or "").strip()]
          print(f"all_bound_phone_rows={len(bound)}")
          for r in bound:
            cid = str(r.get("company_id") or "")
            pid = str(r.get("phone_number_id") or "").strip()
            print(
              "bound",
              f"company_id={cid}",
              f"phone={pid}",
              f"enabled={r.get('enabled')}",
              f"waba={r.get('business_account_id') or ''}",
              f"is_keep={cid.lower() == keep}",
            )

          if not phone:
            print("status=list_only")
            sys.exit(0)
          if not phone.isdigit() or not (5 <= len(phone) <= 32):
            print("Invalid phone_number_id")
            sys.exit(2)

          matches = [r for r in bound if str(r.get("phone_number_id") or "").strip() == phone]
          print(f"matching_rows={len(matches)}")
          conflicts = []
          for r in matches:
            cid = str(r.get("company_id") or "")
            is_keep = cid.lower() == keep
            print(
              "row",
              f"company_id={cid}",
              f"enabled={r.get('enabled')}",
              f"waba={r.get('business_account_id') or ''}",
              f"is_keep={is_keep}",
            )
            if not is_keep:
              conflicts.append(r)
          print(f"conflict_rows={len(conflicts)}")
          if not conflicts:
            print("status=no_conflicts")
            sys.exit(0)
          if not apply:
            for r in conflicts:
              print(f"would_disconnect company_id={r.get('company_id')}")
            print("status=dry_run_would_disconnect")
            sys.exit(0)

          for r in conflicts:
            cid = str(r["company_id"])
            q = urllib.parse.urlencode(
              {
                "company_id": f"eq.{cid}",
                "phone_number_id": f"eq.{phone}",
              }
            )
            # PostgREST expects filter query style: ?company_id=eq.uuid
            path = (
              "/rest/v1/company_whatsapp_settings"
              f"?company_id=eq.{urllib.parse.quote(cid)}"
              f"&phone_number_id=eq.{urllib.parse.quote(phone)}"
            )
            st, out = req(
              "PATCH",
              path,
              {
                "enabled": False,
                "phone_number_id": "",
                "business_account_id": "",
                "access_token": "",
                "token_status": "missing",
              },
            )
            print(f"disconnected company_id={cid} http={st} rows={len(out) if isinstance(out, list) else out}")
          print("status=applied")
          PY
