name: Production Gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Supabase migration version uniqueness
        run: pnpm check:migrations

      - name: Platform crypto tests
        run: pnpm --dir lib/platform-crypto test

      - name: Channel platform tests
        working-directory: lib/channel-platform
        run: |
          set -o pipefail
          LOG_FILE="${{ runner.temp }}/channel-platform-tests.log"
          if ! pnpm test 2>&1 | tee "$LOG_FILE"; then
            {
              echo "## Channel platform test failure"
              echo ""
              echo '```'
              tail -n 160 "$LOG_FILE"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Login app typecheck
        run: pnpm --dir artifacts/login-app typecheck

      - name: Login app production build
        run: pnpm --dir artifacts/login-app build

      - name: API server build
        run: pnpm --dir artifacts/api-server build

      # Live billing/runtime probes (gate steps 6–7) require a real Supabase project.
      # Do not substitute placeholder URL/key values — probes authenticate and call RPCs.
      - name: Production gate (billing + runtime)
        run: pnpm --dir artifacts/login-app production:gate
        env:
          CI: true
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Channel platform E2E
        run: pnpm --dir artifacts/login-app channel:e2e
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # WhatsApp E2E is Local-only (VALUEOR_ENV=local + http://127.0.0.1:54321).
      # It must not receive production publishable credentials; do not wire those secrets here.
      - name: WhatsApp adapter E2E
        run: pnpm --dir artifacts/login-app whatsapp:e2e
