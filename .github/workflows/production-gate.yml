name: Production Gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Supabase migration version uniqueness
        run: pnpm check:migrations

      - name: Platform crypto tests
        run: pnpm --dir lib/platform-crypto test

      - name: Channel platform tests
        working-directory: lib/channel-platform
        run: |
          set -o pipefail
          LOG_FILE="${{ runner.temp }}/channel-platform-tests.log"
          if ! pnpm test 2>&1 | tee "$LOG_FILE"; then
            {
              echo "## Channel platform test failure"
              echo ""
              echo '```'
              tail -n 160 "$LOG_FILE"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Login app typecheck
        run: pnpm --dir artifacts/login-app typecheck

      - name: Login app production build
        run: pnpm --dir artifacts/login-app build

      - name: API server build
        run: pnpm --dir artifacts/api-server build

      # Live billing/runtime probes (gate steps 6–7) require a real Supabase project.
      # Do not substitute placeholder URL/key values — probes authenticate and call RPCs.
      - name: Production gate (billing + runtime)
        run: pnpm --dir artifacts/login-app production:gate
        env:
          CI: true
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # E2E writes demo data. Run it only against an isolated local Supabase, never Production.
      # CLI 2.109.1 tries public.ecr.aws first. GitHub-hosted runners share that
      # registry's anonymous 500 GB/month quota. setup-cli forces ghcr.io only for
      # CLI versions below 2.108.0, so this step sets the same registry. Pulls stay
      # anonymous: these public ghcr.io/supabase tags do not need a token.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start isolated local Supabase for E2E
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: |
          set +e
          supabase start --exclude studio,imgproxy,vector,edge-runtime,analytics > "${RUNNER_TEMP}/supabase-start.log" 2>&1
          start_code=$?
          set -e
          if [ "$start_code" -ne 0 ]; then
            echo "::error::supabase start failed with exit ${start_code}"
            RUNNER_TEMP="${RUNNER_TEMP}" python3 - << 'PY'
          import os, re
          path = os.path.join(os.environ["RUNNER_TEMP"], "supabase-start.log")
          text = open(path, errors="replace").read()
          text = re.sub(r"eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+", "[redacted]", text)
          text = re.sub(r"sb_[A-Za-z0-9_-]+", "[redacted]", text)
          lines = [ln.strip() for ln in text.splitlines() if ln.strip()]
          interesting = [
              ln for ln in lines
              if re.search(r"error|fatal|panic|denied|invalid", ln, re.I)
              and "Applying migration" not in ln
          ]
          chosen = (interesting or lines)[-12:]
          for ln in chosen:
              safe = ln.replace("%", "%25").replace("\r", "")[:500]
              print(f"::error::{safe}")
          PY
            exit "$start_code"
          fi
          set +e
          supabase status -o env > "${RUNNER_TEMP}/supabase-local.env" 2>"${RUNNER_TEMP}/supabase-status.err"
          status_code=$?
          set -e
          if [ "$status_code" -ne 0 ]; then
            echo "::error::supabase status failed with exit ${status_code}"
            exit "$status_code"
          fi
          grep -E '^[A-Z0-9_]+=' "${RUNNER_TEMP}/supabase-local.env" > "${RUNNER_TEMP}/supabase-local.clean.env" || true
          if [ ! -s "${RUNNER_TEMP}/supabase-local.clean.env" ]; then
            echo "::error::supabase status did not emit KEY=VALUE lines"
            exit 1
          fi

      - name: Channel platform E2E
        run: |
          set -a
          # shellcheck disable=SC1091
          . "${RUNNER_TEMP}/supabase-local.clean.env"
          set +a
          export VALUEOR_ENV=local
          export VITE_SUPABASE_URL="http://127.0.0.1:54321"
          export VITE_SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-${ANON_KEY}}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-${SUPABASE_SERVICE_ROLE_KEY}}"
          if [ -z "${VITE_SUPABASE_PUBLISHABLE_KEY}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::Local Supabase key missing after supabase status"
            exit 1
          fi
          set +e
          pnpm --dir artifacts/login-app channel:e2e > "${RUNNER_TEMP}/channel-e2e.log" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::Channel platform E2E failed with exit ${code}"
            RUNNER_TEMP="${RUNNER_TEMP}" LOG_NAME=channel-e2e.log python3 - << 'PY'
          import os, re
          path = os.path.join(os.environ["RUNNER_TEMP"], os.environ["LOG_NAME"])
          text = open(path, errors="replace").read()
          text = re.sub(r"eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+", "[redacted]", text)
          text = re.sub(r"sb_[A-Za-z0-9_-]+", "[redacted]", text)
          lines = [ln.strip() for ln in text.splitlines() if ln.strip()]
          interesting = [ln for ln in lines if re.search(r"error|fail|SAFETY|missing|invalid|denied", ln, re.I)]
          for ln in (interesting or lines)[-15:]:
              safe = ln.replace("%", "%25").replace("\r", "")[:500]
              print(f"::error::{safe}")
          PY
            exit "$code"
          fi

      - name: WhatsApp adapter E2E
        run: |
          set -a
          # shellcheck disable=SC1091
          . "${RUNNER_TEMP}/supabase-local.clean.env"
          set +a
          export VALUEOR_ENV=local
          export VITE_SUPABASE_URL="http://127.0.0.1:54321"
          export VITE_SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-${ANON_KEY}}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-${SUPABASE_SERVICE_ROLE_KEY}}"
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::Local service role key missing after supabase status"
            exit 1
          fi
          set +e
          pnpm --dir artifacts/login-app whatsapp:e2e > "${RUNNER_TEMP}/whatsapp-e2e.log" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::WhatsApp adapter E2E failed with exit ${code}"
            RUNNER_TEMP="${RUNNER_TEMP}" LOG_NAME=whatsapp-e2e.log python3 - << 'PY'
          import os, re
          path = os.path.join(os.environ["RUNNER_TEMP"], os.environ["LOG_NAME"])
          text = open(path, errors="replace").read()
          text = re.sub(r"eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+", "[redacted]", text)
          text = re.sub(r"sb_[A-Za-z0-9_-]+", "[redacted]", text)
          lines = [ln.strip() for ln in text.splitlines() if ln.strip()]
          interesting = [ln for ln in lines if re.search(r"error|fail|SAFETY|missing|invalid|denied", ln, re.I)]
          for ln in (interesting or lines)[-15:]:
              safe = ln.replace("%", "%25").replace("\r", "")[:500]
              print(f"::error::{safe}")
          PY
            exit "$code"
          fi
