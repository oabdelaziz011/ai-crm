name: Production Gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Supabase migration version uniqueness
        run: pnpm check:migrations

      - name: Platform crypto tests
        run: pnpm --dir lib/platform-crypto test

      - name: Channel platform tests
        working-directory: lib/channel-platform
        run: |
          set -o pipefail
          LOG_FILE="${{ runner.temp }}/channel-platform-tests.log"
          if ! pnpm test 2>&1 | tee "$LOG_FILE"; then
            {
              echo "## Channel platform test failure"
              echo ""
              echo '```'
              tail -n 160 "$LOG_FILE"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Login app typecheck
        run: pnpm --dir artifacts/login-app typecheck

      - name: Login app production build
        run: pnpm --dir artifacts/login-app build
        env:
          VITE_API_SERVER_URL: https://api.valueor.org
          VITE_WEBHOOK_BASE_URL: https://webhook.valueor.org
          VITE_APP_ORIGIN: https://www.valueor.org

      - name: Upload frontend production build
        uses: actions/upload-artifact@v4
        with:
          name: valueor-frontend-build
          path: artifacts/login-app/dist/public/
          if-no-files-found: error
          retention-days: 7

      - name: API server build
        run: pnpm --dir artifacts/api-server build

      # Live billing/runtime probes (gate steps 6–7) require a real Supabase project.
      # Do not substitute placeholder URL/key values — probes authenticate and call RPCs.
      - name: Production gate (billing + runtime)
        run: pnpm --dir artifacts/login-app production:gate
        env:
          CI: true
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # E2E writes demo data. Run it only against an isolated local Supabase, never Production.
      # CLI 2.109.1 tries public.ecr.aws first. GitHub-hosted runners share that
      # registry's anonymous 500 GB/month quota. setup-cli forces ghcr.io only for
      # CLI versions below 2.108.0, so this step sets the same registry. Pulls stay
      # anonymous: these public ghcr.io/supabase tags do not need a token.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # Local Supabase host ports (54320–54329) sit inside Linux's default ephemeral
      # source-port range (32768–60999). On GitHub-hosted runners an outbound TCP
      # connection (Actions agent → GitHub, registry pulls, etc.) can hold e.g.
      # :54322 as its *source* port; dockerd then fails with:
      #   failed to bind host port 0.0.0.0:54322/tcp: address already in use
      # This is not a leftover Supabase stack and not Production. Fix: reserve the
      # port range, stop only this project's Supabase containers, and reclaim
      # sockets that still hold those *local* ports before start. Always stop after.
      - name: Start isolated local Supabase for E2E
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: |
          set -euo pipefail

          diagnose_ports() {
            echo "::group::Supabase port / container diagnostics"
            echo "ss (LISTEN+ESTAB) on 54320-54329:"
            ss -tanH '( sport >= :54320 and sport <= :54329 )' || true
            echo "docker containers matching supabase_*_project:"
            docker ps -a --filter "name=supabase_" --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
            echo "::endgroup::"
          }

          reclaim_supabase_host_ports() {
            # Destroy only sockets whose *local* port is in the Supabase host range.
            # Does not kill unrelated processes by PID; ss -K targets matching sockets.
            for p in 54320 54321 54322 54323 54324 54325 54326 54327 54328 54329; do
              if ss -tanH "sport = :$p" | grep -q .; then
                echo "Reclaiming local sockets on :$p"
                ss -tanp "sport = :$p" || true
                sudo ss -K "sport = :$p" || true
              fi
            done
          }

          diagnose_ports

          # Preventive: stop the kernel from assigning these as ephemeral source ports.
          sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329

          # Deterministic cleanup of *this* CLI project only (config project_id = "project").
          set +e
          supabase stop --no-backup > "${RUNNER_TEMP}/supabase-stop-before.log" 2>&1
          stop_before_code=$?
          set -e
          echo "supabase stop (before) exit=${stop_before_code}"

          # Only remove containers named for this local project id — never docker system prune.
          mapfile -t stale_containers < <(docker ps -aq --filter "name=supabase_" --filter "name=_project" 2>/dev/null || true)
          if [ "${#stale_containers[@]}" -gt 0 ]; then
            echo "Removing leftover supabase_*_project containers: ${stale_containers[*]}"
            docker rm -f "${stale_containers[@]}" || true
          fi

          reclaim_supabase_host_ports
          diagnose_ports

          start_supabase() {
            set +e
            supabase start --exclude studio,imgproxy,vector,edge-runtime,analytics > "${RUNNER_TEMP}/supabase-start.log" 2>&1
            echo $?
            set -e
          }

          start_code="$(start_supabase)"
          if [ "$start_code" -ne 0 ] && grep -qiE 'address already in use|bind host port' "${RUNNER_TEMP}/supabase-start.log"; then
            echo "::warning::supabase start hit host-port EADDRINUSE; reclaiming 54320-54329 and retrying once"
            diagnose_ports
            reclaim_supabase_host_ports
            set +e
            supabase stop --no-backup > "${RUNNER_TEMP}/supabase-stop-retry.log" 2>&1
            set -e
            sleep 2
            start_code="$(start_supabase)"
          fi

          if [ "$start_code" -ne 0 ]; then
            echo "::error::supabase start failed with exit ${start_code}"
            diagnose_ports
            RUNNER_TEMP="${RUNNER_TEMP}" python3 - << 'PY'
          import os, re
          path = os.path.join(os.environ["RUNNER_TEMP"], "supabase-start.log")
          text = open(path, errors="replace").read()
          text = re.sub(r"eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+", "[redacted]", text)
          text = re.sub(r"sb_[A-Za-z0-9_-]+", "[redacted]", text)
          lines = [ln.strip() for ln in text.splitlines() if ln.strip()]
          interesting = [
              ln for ln in lines
              if re.search(r"error|fatal|panic|denied|invalid|already in use|bind", ln, re.I)
              and "Applying migration" not in ln
          ]
          chosen = (interesting or lines)[-12:]
          for ln in chosen:
              safe = ln.replace("%", "%25").replace("\r", "")[:500]
              print(f"::error::{safe}")
          PY
            exit "$start_code"
          fi

          set +e
          supabase status -o env > "${RUNNER_TEMP}/supabase-local.env" 2>"${RUNNER_TEMP}/supabase-status.err"
          status_code=$?
          set -e
          if [ "$status_code" -ne 0 ]; then
            echo "::error::supabase status failed with exit ${status_code}"
            exit "$status_code"
          fi
          grep -E '^[A-Z0-9_]+=' "${RUNNER_TEMP}/supabase-local.env" > "${RUNNER_TEMP}/supabase-local.clean.env" || true
          if [ ! -s "${RUNNER_TEMP}/supabase-local.clean.env" ]; then
            echo "::error::supabase status did not emit KEY=VALUE lines"
            exit 1
          fi

      - name: Stop isolated local Supabase after E2E
        if: always()
        run: |
          set +e
          supabase stop --no-backup > "${RUNNER_TEMP}/supabase-stop-after.log" 2>&1
          code=$?
          set -e
          echo "supabase stop (after) exit=${code}"
          # Best-effort: only this project's named containers.
          mapfile -t leftover < <(docker ps -aq --filter "name=supabase_" --filter "name=_project" 2>/dev/null || true)
          if [ "${#leftover[@]}" -gt 0 ]; then
            docker rm -f "${leftover[@]}" || true
          fi

      - name: Channel platform E2E
        run: |
          set -a
          # shellcheck disable=SC1091
          . "${RUNNER_TEMP}/supabase-local.clean.env"
          set +a
          export VALUEOR_ENV=local
          export VITE_SUPABASE_URL="http://127.0.0.1:54321"
          export VITE_SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-${ANON_KEY}}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-${SUPABASE_SERVICE_ROLE_KEY}}"
          if [ -z "${VITE_SUPABASE_PUBLISHABLE_KEY}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::Local Supabase key missing after supabase status"
            exit 1
          fi
          set +e
          pnpm --dir artifacts/login-app channel:e2e > "${RUNNER_TEMP}/channel-e2e.log" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::Channel platform E2E failed with exit ${code}"
            RUNNER_TEMP="${RUNNER_TEMP}" LOG_NAME=channel-e2e.log python3 - << 'PY'
          import os, re
          path = os.path.join(os.environ["RUNNER_TEMP"], os.environ["LOG_NAME"])
          text = open(path, errors="replace").read()
          text = re.sub(r"eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+", "[redacted]", text)
          text = re.sub(r"sb_[A-Za-z0-9_-]+", "[redacted]", text)
          lines = [ln.strip() for ln in text.splitlines() if ln.strip()]
          interesting = [ln for ln in lines if re.search(r"error|fail|SAFETY|missing|invalid|denied", ln, re.I)]
          for ln in (interesting or lines)[-15:]:
              safe = ln.replace("%", "%25").replace("\r", "")[:500]
              print(f"::error::{safe}")
          PY
            exit "$code"
          fi

      - name: WhatsApp adapter E2E
        run: |
          set -a
          # shellcheck disable=SC1091
          . "${RUNNER_TEMP}/supabase-local.clean.env"
          set +a
          export VALUEOR_ENV=local
          export VITE_SUPABASE_URL="http://127.0.0.1:54321"
          export VITE_SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-${ANON_KEY}}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-${SUPABASE_SERVICE_ROLE_KEY}}"
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::Local service role key missing after supabase status"
            exit 1
          fi
          set +e
          pnpm --dir artifacts/login-app whatsapp:e2e > "${RUNNER_TEMP}/whatsapp-e2e.log" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::WhatsApp adapter E2E failed with exit ${code}"
            RUNNER_TEMP="${RUNNER_TEMP}" LOG_NAME=whatsapp-e2e.log python3 - << 'PY'
          import os, re
          path = os.path.join(os.environ["RUNNER_TEMP"], os.environ["LOG_NAME"])
          text = open(path, errors="replace").read()
          text = re.sub(r"eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+", "[redacted]", text)
          text = re.sub(r"sb_[A-Za-z0-9_-]+", "[redacted]", text)
          lines = [ln.strip() for ln in text.splitlines() if ln.strip()]
          interesting = [ln for ln in lines if re.search(r"error|fail|SAFETY|missing|invalid|denied", ln, re.I)]
          for ln in (interesting or lines)[-15:]:
              safe = ln.replace("%", "%25").replace("\r", "")[:500]
              print(f"::error::{safe}")
          PY
            exit "$code"
          fi
