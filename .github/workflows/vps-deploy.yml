name: VPS deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: deploy installs the approved main SHA release; rollback restores the previous release symlinks
        type: choice
        options:
          - deploy
          - rollback
        default: deploy
      confirm:
        description: Type deploy or rollback again, matching the action
        required: true
        type: string

permissions:
  contents: read

jobs:
  guard:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == github.event.inputs.action
    runs-on: ubuntu-latest
    steps:
      - name: Confirm manual main-branch action
        run: echo "Approved ${{ github.event.inputs.action }} for ${{ github.sha }}"

  gate:
    needs: guard
    if: github.event.inputs.action == 'deploy'
    uses: ./.github/workflows/production-gate.yml
    secrets: inherit

  build:
    needs: [guard, gate]
    if: always() && needs.guard.result == 'success' && needs.gate.result == 'success' && github.event.inputs.action == 'deploy' && github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate nginx/systemd deploy path
        run: |
          node scripts/validate-vps-config.mjs
          node --test scripts/validate-vps-config.test.mjs scripts/systemd-release.test.mjs

      - name: Build API bundle
        run: pnpm --dir artifacts/api-server build

      - name: Build frontend bundle
        run: pnpm --dir artifacts/login-app build
        env:
          VITE_APP_ORIGIN: https://www.valueor.org
          VITE_SITE_URL: https://www.valueor.org
          VITE_API_SERVER_URL: https://api.valueor.org
          VITE_WEBHOOK_BASE_URL: https://webhook.valueor.org
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Bake-time UI gates (not read from server .env at runtime).
          # Embedded Signup UI must match previously working prod (server flag already true).
          # Coexistence stays off until Meta eligibility is explicitly approved.
          VITE_WHATSAPP_EMBEDDED_SIGNUP_ENABLED: "true"
          VITE_WHATSAPP_COEXISTENCE_ENABLED: "false"
          # Messenger OAuth UI: narrow ValueOR enablement (server allowlist still required).
          # Pages OAuth stays off (Messenger Login path is preferred).
          # Instagram Login UI: narrow ValueOR enablement (server allowlist still required).
          VITE_META_MESSENGER_OAUTH_ENABLED: "true"
          VITE_META_INSTAGRAM_LOGIN_ENABLED: "true"
          VITE_META_PAGES_OAUTH_ENABLED: "false"

      - name: Write frontend version.json
        run: |
          printf '{"service":"login-app","sha":"%s"}\n' "${GITHUB_SHA}" \
            > artifacts/login-app/dist/public/version.json

      - name: Verify frontend production hosts
        run: node scripts/verify-frontend-production-bundle.mjs artifacts/login-app/dist/public

      - name: Stage release artifact tree
        run: |
          set -euo pipefail
          STAGE="${RUNNER_TEMP}/valueor-release-${GITHUB_SHA}"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/api/artifacts/api-server/dist"
          mkdir -p "$STAGE/api/deploy/vps"
          mkdir -p "$STAGE/api/scripts"
          cp -a artifacts/api-server/dist/. "$STAGE/api/artifacts/api-server/dist/"
          cp deploy/vps/start-api.mjs "$STAGE/api/deploy/vps/start-api.mjs"
          cp -a scripts/lib "$STAGE/api/scripts/lib"
          cp package.json "$STAGE/api/package.json"
          mkdir -p "$STAGE/frontend"
          cp -a artifacts/login-app/dist/public/. "$STAGE/frontend/"
          test -f "$STAGE/api/artifacts/api-server/dist/main.mjs"
          test -f "$STAGE/frontend/index.html"
          test -f "$STAGE/frontend/version.json"
          tar -C "$STAGE" -czf "${RUNNER_TEMP}/valueor-release-${GITHUB_SHA}.tgz" api frontend
          echo "STAGE_TGZ=${RUNNER_TEMP}/valueor-release-${GITHUB_SHA}.tgz" >> "$GITHUB_ENV"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: valueor-production-release
          path: ${{ env.STAGE_TGZ }}
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: [guard, gate, build]
    if: |
      always()
      && needs.guard.result == 'success'
      && github.event.inputs.confirm == github.event.inputs.action
      && (
        (github.event.inputs.action == 'deploy' && needs.gate.result == 'success' && needs.build.result == 'success')
        || (github.event.inputs.action == 'rollback' && needs.gate.result == 'skipped' && needs.build.result == 'skipped')
      )
    # Contabo self-hosted runner only. Unique label prevents accidental pickup by other workflows.
    runs-on: [self-hosted, linux, x64, valueor-production]
    environment: production
    timeout-minutes: 30
    steps:
      - name: Clean stale Contabo artifact downloads
        if: github.event.inputs.action == 'deploy'
        run: |
          set -euo pipefail
          rm -rf /tmp/valueor-gha-artifacts
          mkdir -p /tmp/valueor-gha-artifacts

      - name: Download release artifact
        if: github.event.inputs.action == 'deploy'
        uses: actions/download-artifact@v4
        with:
          name: valueor-production-release
          path: /tmp/valueor-gha-artifacts

      - name: Stage incoming release for root deploy wrapper
        if: github.event.inputs.action == 'deploy'
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          GIT_SHA="$(printf '%s' "$GIT_SHA" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$GIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Refusing a ref that is not a full git SHA."
            exit 2
          fi
          # Prefer the SHA-named tarball; never silently pick a leftover older artifact.
          TGZ="/tmp/valueor-gha-artifacts/valueor-release-${GIT_SHA}.tgz"
          if [[ ! -f "$TGZ" ]]; then
            TGZ="$(find /tmp/valueor-gha-artifacts -name "valueor-release-${GIT_SHA}.tgz" -type f | head -n 1)"
          fi
          if [[ -z "${TGZ}" || ! -f "$TGZ" ]]; then
            echo "::error::Missing valueor-release-${GIT_SHA}.tgz under /tmp/valueor-gha-artifacts"
            find /tmp/valueor-gha-artifacts -type f -name '*.tgz' -print || true
            exit 2
          fi
          echo "artifact_tgz=$TGZ"
          sha256sum "$TGZ"
          INCOMING="/tmp/valueor-incoming-${GIT_SHA}"
          rm -rf "$INCOMING"
          mkdir -p "$INCOMING"
          tar -xzf "$TGZ" -C "$INCOMING"
          test -f "${INCOMING}/api/artifacts/api-server/dist/main.mjs"
          test -f "${INCOMING}/frontend/index.html"
          test -f "${INCOMING}/frontend/version.json"
          ACTUAL="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["sha"].lower())' "${INCOMING}/frontend/version.json")"
          echo "artifact_frontend_sha=$ACTUAL"
          if [[ "$ACTUAL" != "$GIT_SHA" ]]; then
            echo "::error::Staged frontend version.json sha mismatch (got ${ACTUAL}, expected ${GIT_SHA})"
            exit 2
          fi
          echo "Staged release under ${INCOMING} (artifact names only; secrets not logged)"

      - name: Stage Instagram Login env overlay for approved company only
        if: github.event.inputs.action == 'deploy'
        env:
          GIT_SHA: ${{ github.sha }}
          META_INSTAGRAM_LOGIN_APP_SECRET: ${{ secrets.META_INSTAGRAM_LOGIN_APP_SECRET }}
        run: |
          set -euo pipefail
          GIT_SHA="$(printf '%s' "$GIT_SHA" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$GIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Refusing a ref that is not a full git SHA."
            exit 2
          fi
          if [[ -z "${META_INSTAGRAM_LOGIN_APP_SECRET:-}" ]]; then
            echo "::error::META_INSTAGRAM_LOGIN_APP_SECRET missing from production environment secrets."
            exit 2
          fi
          # Length/fingerprint only — never print the secret.
          SECRET_LEN="${#META_INSTAGRAM_LOGIN_APP_SECRET}"
          SECRET_FP="$(printf '%s' "$META_INSTAGRAM_LOGIN_APP_SECRET" | sha256sum | awk '{print substr($1,1,12)}')"
          echo "instagram_secret_len=${SECRET_LEN} sha256_12=${SECRET_FP}"
          if [[ "$SECRET_LEN" -lt 20 ]]; then
            echo "::error::Instagram App Secret looks too short."
            exit 2
          fi
          INCOMING="/tmp/valueor-incoming-${GIT_SHA}"
          test -d "$INCOMING"
          OVERLAY="${INCOMING}/.instagram-login.env.overlay"
          umask 077
          cat >"$OVERLAY" <<EOF
          META_INSTAGRAM_LOGIN_ENABLED=true
          META_INSTAGRAM_LOGIN_ALLOWED_COMPANY_IDS=2d27f7fb-c15e-4d60-84e9-1793f36f2172
          META_INSTAGRAM_LOGIN_APP_ID=4567945626796573
          META_INSTAGRAM_LOGIN_APP_SECRET=${META_INSTAGRAM_LOGIN_APP_SECRET}
          META_INSTAGRAM_LOGIN_REDIRECT_URI=https://api.valueor.org/api/oauth/instagram/callback
          META_INSTAGRAM_LOGIN_GRAPH_VERSION=v21.0
          EOF
          # Strip accidental leading spaces from heredoc indentation
          sed -i 's/^[[:space:]]*//' "$OVERLAY"
          chmod 600 "$OVERLAY"
          echo "overlay_keys=$(cut -d= -f1 "$OVERLAY" | paste -sd, -)"
          # Refuse public-all allowlist
          if grep -Eq '^META_INSTAGRAM_LOGIN_ALLOWED_COMPANY_IDS=\*' "$OVERLAY"; then
            echo "::error::Refusing public-all Instagram allowlist"
            exit 2
          fi

      - name: Stage Messenger OAuth env overlay for approved company only
        if: github.event.inputs.action == 'deploy'
        env:
          GIT_SHA: ${{ github.sha }}
          # Prefer dedicated Messenger secret; fall back to Instagram Login secret (same Meta app).
          META_MESSENGER_OAUTH_APP_SECRET_DEDICATED: ${{ secrets.META_MESSENGER_OAUTH_APP_SECRET }}
          META_INSTAGRAM_LOGIN_APP_SECRET: ${{ secrets.META_INSTAGRAM_LOGIN_APP_SECRET }}
        run: |
          set -euo pipefail
          GIT_SHA="$(printf '%s' "$GIT_SHA" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$GIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Refusing a ref that is not a full git SHA."
            exit 2
          fi
          META_MESSENGER_OAUTH_APP_SECRET="${META_MESSENGER_OAUTH_APP_SECRET_DEDICATED:-}"
          if [[ -z "$META_MESSENGER_OAUTH_APP_SECRET" ]]; then
            META_MESSENGER_OAUTH_APP_SECRET="${META_INSTAGRAM_LOGIN_APP_SECRET:-}"
          fi
          if [[ -z "${META_MESSENGER_OAUTH_APP_SECRET:-}" ]]; then
            echo "::warning::Messenger OAuth secret missing — skipping Messenger overlay (FE bake may still be on)."
            exit 0
          fi
          SECRET_LEN="${#META_MESSENGER_OAUTH_APP_SECRET}"
          SECRET_FP="$(printf '%s' "$META_MESSENGER_OAUTH_APP_SECRET" | sha256sum | awk '{print substr($1,1,12)}')"
          echo "messenger_secret_len=${SECRET_LEN} sha256_12=${SECRET_FP}"
          if [[ "$SECRET_LEN" -lt 20 ]]; then
            echo "::error::Messenger App Secret looks too short."
            exit 2
          fi
          INCOMING="/tmp/valueor-incoming-${GIT_SHA}"
          test -d "$INCOMING"
          OVERLAY="${INCOMING}/.messenger-oauth.env.overlay"
          umask 077
          cat >"$OVERLAY" <<EOF
          META_MESSENGER_OAUTH_ENABLED=true
          META_MESSENGER_OAUTH_ALLOWED_COMPANY_IDS=2d27f7fb-c15e-4d60-84e9-1793f36f2172
          META_MESSENGER_OAUTH_APP_ID=4567945626796573
          META_MESSENGER_OAUTH_APP_SECRET=${META_MESSENGER_OAUTH_APP_SECRET}
          META_MESSENGER_OAUTH_REDIRECT_URI=https://api.valueor.org/api/oauth/messenger/callback
          META_MESSENGER_OAUTH_GRAPH_VERSION=v21.0
          EOF
          sed -i 's/^[[:space:]]*//' "$OVERLAY"
          chmod 600 "$OVERLAY"
          echo "overlay_keys=$(cut -d= -f1 "$OVERLAY" | paste -sd, -)"
          if grep -Eq '^META_MESSENGER_OAUTH_ALLOWED_COMPANY_IDS=\*' "$OVERLAY"; then
            echo "::error::Refusing public-all Messenger allowlist"
            exit 2
          fi

      - name: Stage WhatsApp Embedded Signup env overlay for approved company only
        if: github.event.inputs.action == 'deploy'
        env:
          GIT_SHA: ${{ github.sha }}
          META_EMBEDDED_SIGNUP_APP_SECRET_DEDICATED: ${{ secrets.META_EMBEDDED_SIGNUP_APP_SECRET }}
          META_EMBEDDED_SIGNUP_CLOUD_API_CONFIG_ID: ${{ secrets.META_EMBEDDED_SIGNUP_CLOUD_API_CONFIG_ID }}
          META_EMBEDDED_SIGNUP_APP_ID_DEDICATED: ${{ secrets.META_EMBEDDED_SIGNUP_APP_ID }}
          META_INSTAGRAM_LOGIN_APP_SECRET: ${{ secrets.META_INSTAGRAM_LOGIN_APP_SECRET }}
        run: |
          set -euo pipefail
          GIT_SHA="$(printf '%s' "$GIT_SHA" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$GIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Refusing a ref that is not a full git SHA."
            exit 2
          fi
          META_EMBEDDED_SIGNUP_APP_SECRET="${META_EMBEDDED_SIGNUP_APP_SECRET_DEDICATED:-}"
          if [[ -z "$META_EMBEDDED_SIGNUP_APP_SECRET" ]]; then
            META_EMBEDDED_SIGNUP_APP_SECRET="${META_INSTAGRAM_LOGIN_APP_SECRET:-}"
          fi
          if [[ -z "${META_EMBEDDED_SIGNUP_APP_SECRET:-}" ]]; then
            echo "::warning::WhatsApp Embedded Signup secret missing — skipping WhatsApp overlay."
            exit 0
          fi
          SECRET_LEN="${#META_EMBEDDED_SIGNUP_APP_SECRET}"
          SECRET_FP="$(printf '%s' "$META_EMBEDDED_SIGNUP_APP_SECRET" | sha256sum | awk '{print substr($1,1,12)}')"
          echo "whatsapp_secret_len=${SECRET_LEN} sha256_12=${SECRET_FP}"
          if [[ "$SECRET_LEN" -lt 20 ]]; then
            echo "::error::WhatsApp App Secret looks too short."
            exit 2
          fi
          APP_ID="${META_EMBEDDED_SIGNUP_APP_ID_DEDICATED:-}"
          if [[ -z "$APP_ID" ]]; then
            # Same Meta app used for Instagram Login / Messenger OAuth on Contabo.
            APP_ID="4567945626796573"
          fi
          CONFIG_ID="${META_EMBEDDED_SIGNUP_CLOUD_API_CONFIG_ID:-}"
          if [[ -n "$CONFIG_ID" ]]; then
            echo "whatsapp_config_id_len=${#CONFIG_ID}"
          else
            echo "::warning::META_EMBEDDED_SIGNUP_CLOUD_API_CONFIG_ID unset — overlay will not overwrite any host CONFIG_ID."
          fi
          INCOMING="/tmp/valueor-incoming-${GIT_SHA}"
          test -d "$INCOMING"
          OVERLAY="${INCOMING}/.whatsapp-embedded-signup.env.overlay"
          umask 077
          {
            echo "WHATSAPP_EMBEDDED_SIGNUP_ENABLED=true"
            echo "WHATSAPP_COEXISTENCE_ENABLED=false"
            echo "WHATSAPP_EMBEDDED_SIGNUP_ALLOWED_COMPANY_IDS=2d27f7fb-c15e-4d60-84e9-1793f36f2172"
            echo "WHATSAPP_EMBEDDED_SIGNUP_AUTO_SUBSCRIBE=false"
            echo "WHATSAPP_EMBEDDED_SIGNUP_ALLOW_PRODUCTION_SUBSCRIBE=false"
            echo "WHATSAPP_EMBEDDED_SIGNUP_REGISTER_PHONE=false"
            echo "META_EMBEDDED_SIGNUP_APP_ID=${APP_ID}"
            echo "META_EMBEDDED_SIGNUP_APP_SECRET=${META_EMBEDDED_SIGNUP_APP_SECRET}"
            echo "META_EMBEDDED_SIGNUP_GRAPH_VERSION=v21.0"
            if [[ -n "$CONFIG_ID" ]]; then
              echo "META_EMBEDDED_SIGNUP_CLOUD_API_CONFIG_ID=${CONFIG_ID}"
            fi
          } >"$OVERLAY"
          chmod 600 "$OVERLAY"
          echo "overlay_keys=$(cut -d= -f1 "$OVERLAY" | paste -sd, -)"
          if grep -Eq '^WHATSAPP_EMBEDDED_SIGNUP_ALLOWED_COMPANY_IDS=\*' "$OVERLAY"; then
            echo "::error::Refusing public-all WhatsApp allowlist"
            exit 2
          fi

      - name: Run production deploy or rollback on this host
        env:
          ACTION: ${{ github.event.inputs.action }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            deploy)
              if [[ ! "$GIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::Refusing a ref that is not a full git SHA."
                exit 2
              fi
              sudo -n /usr/local/sbin/valueor-prod-deploy "$GIT_SHA" "/tmp/valueor-incoming-${GIT_SHA}"
              ;;
            rollback)
              sudo -n /usr/local/sbin/valueor-prod-rollback
              ;;
            *)
              echo "::error::Unsupported action: $ACTION"
              exit 2
              ;;
          esac
