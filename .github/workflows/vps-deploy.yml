name: VPS deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: deploy builds the selected main SHA; rollback restores the previous image tags
        type: choice
        options:
          - deploy
          - rollback
        default: deploy
      confirm:
        description: Type deploy or rollback again, matching the action
        required: true
        type: string

permissions:
  contents: read

jobs:
  guard:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == github.event.inputs.action
    runs-on: ubuntu-latest
    steps:
      - name: Confirm manual main-branch action
        run: echo "Approved ${{ github.event.inputs.action }} for ${{ github.sha }}"

  gate:
    needs: guard
    if: github.event.inputs.action == 'deploy'
    uses: ./.github/workflows/production-gate.yml
    secrets: inherit

  deploy:
    needs: [guard, gate]
    if: always() && needs.guard.result == 'success' && (needs.gate.result == 'success' || needs.gate.result == 'skipped') && github.event.inputs.confirm == github.event.inputs.action
    # Contabo self-hosted runner only. Unique label prevents accidental pickup by other workflows.
    runs-on: [self-hosted, linux, x64, valueor-production]
    environment: production
    steps:
      - name: Run production deploy or rollback on this host
        env:
          ACTION: ${{ github.event.inputs.action }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            deploy)
              if [[ ! "$GIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::Refusing a ref that is not a full git SHA."
                exit 2
              fi
              sudo -n /usr/local/sbin/valueor-prod-deploy "$GIT_SHA"
              ;;
            rollback)
              sudo -n /usr/local/sbin/valueor-prod-rollback
              ;;
            *)
              echo "::error::Unsupported action: $ACTION"
              exit 2
              ;;
          esac
