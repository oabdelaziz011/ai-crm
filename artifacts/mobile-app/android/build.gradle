// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    def kotlinVersion = findProperty('android.kotlinVersion')
    classpath(kotlinVersion ? "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion" : 'org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// CMake 3.22.1 ships Ninja 1.10.2, which cannot stat or create a path longer
// than 260 characters. Prefab CMake files in this pnpm tree are longer than
// that, so Ninja treats them as missing and regenerates the manifest forever.
// Object paths are longer still. CMake 3.31.6 ships Ninja 1.12.1, which can
// use Windows long paths. Glob verification stays enabled.
def enableLongPathCmake = { cmake ->
  cmake.version "3.31.6"
}
subprojects { subproject ->
  subproject.plugins.withId("com.android.library") {
    subproject.androidComponents {
      finalizeDsl { extension ->
        def cmake = extension.externalNativeBuild.cmake
        if (cmake.path instanceof File) {
          enableLongPathCmake(cmake)
        }
      }
    }
  }
}
