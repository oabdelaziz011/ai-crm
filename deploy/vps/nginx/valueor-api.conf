# API and webhook hostnames share one Node process on 127.0.0.1:3001.
# Install as /etc/nginx/sites-available/valueor-api and enable the symlink.
# Keep the Origin Certificate paths unchanged on the server.

server_tokens off;

upstream valueor_api {
  server 127.0.0.1:3001;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name api.valueor.org webhook.valueor.org;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.valueor.org webhook.valueor.org;

  ssl_certificate     /etc/nginx/ssl/origin-cert.pem;
  ssl_certificate_key /etc/nginx/ssl/origin-key.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 12m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location ~ /\. {
    deny all;
  }

  location = /healthz {
    proxy_pass http://valueor_api/api/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://valueor_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    # Preserve the raw body for Meta signature validation on webhook routes.
    proxy_request_buffering on;
  }
}
