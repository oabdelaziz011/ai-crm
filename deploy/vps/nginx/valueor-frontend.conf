# Frontend SPA. Install as /etc/nginx/sites-available/valueor and enable the symlink.
# Certificate paths match the installed Cloudflare Origin Certificate on the VPS.
# Do not overwrite the certificate files from this repository.

server_tokens off;

server {
  listen 80;
  listen [::]:80;
  server_name www.valueor.org valueor.org;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.valueor.org valueor.org;

  ssl_certificate     /etc/nginx/ssl/origin-cert.pem;
  ssl_certificate_key /etc/nginx/ssl/origin-key.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  root /var/www/valueor;
  absolute_redirect off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  location ~ /\. {
    deny all;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /version.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
