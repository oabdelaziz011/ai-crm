# Developer tunnel template. pnpm tunnel:setup refuses webhook.valueor.org.
# Production ingress is infra/cloudflare/production-ingress.example.yml and must
# be rendered with PRODUCTION_API_ORIGIN. Never point that hostname at localhost.

tunnel: ${CLOUDFLARE_TUNNEL_ID}
credentials-file: ${CLOUDFLARE_TUNNEL_CREDENTIALS_FILE}

ingress:
  - hostname: ${CLOUDFLARE_TUNNEL_HOSTNAME}
    service: http://localhost:${API_SERVER_PORT}
    originRequest:
      connectTimeout: 30s
      noTLSVerify: false
  - service: http_status:404
