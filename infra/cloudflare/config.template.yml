# Named Cloudflare Tunnel — stable public hostname for Meta WhatsApp webhooks.
# Generated by: pnpm tunnel:setup
#
# Do NOT use `cloudflared tunnel --url` (quick tunnels). Always run:
#   pnpm tunnel:run
# or:
#   cloudflared tunnel --config infra/cloudflare/config.yml run

tunnel: ${CLOUDFLARE_TUNNEL_ID}
credentials-file: ${CLOUDFLARE_TUNNEL_CREDENTIALS_FILE}

ingress:
  - hostname: ${CLOUDFLARE_TUNNEL_HOSTNAME}
    service: http://localhost:${API_SERVER_PORT}
    originRequest:
      connectTimeout: 30s
      noTLSVerify: false
  - service: http_status:404
